<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Engetmix — Orçamentos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#0F2540;
    --navy-2:#1B3A5F;
    --red:#C8202F;
    --red-dark:#9E1723;
    --paper:#FFFFFF;
    --bg:#F2F4F6;
    --border:#DDE2E7;
    --text:#1B222C;
    --muted:#69737D;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:var(--font); color:var(--text);}
  .wrap{max-width:520px; margin:0 auto; padding-bottom:96px;}

  header{
    background:var(--navy);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky; top:0; z-index:20;
  }
  header img{height:34px; display:block;}
  header .htxt{color:#fff; font-size:13px; font-weight:600; letter-spacing:.2px;}
  header .htxt small{display:block; color:#9FB3C8; font-size:10.5px; font-weight:500;}
  header button#resetBtn{
    margin-left:auto; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    color:#fff; font-size:12px; padding:8px 10px; border-radius:7px; font-family:var(--font);
  }

  .segmented{
    display:flex; gap:6px; padding:12px 16px 4px 16px;
  }
  .segmented button{
    flex:1; padding:11px 4px; border-radius:9px; border:1.5px solid var(--border);
    background:#fff; color:var(--muted); font-size:13px; font-weight:700; font-family:var(--font);
  }
  .segmented button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .card{
    background:#fff; margin:12px 16px; border-radius:12px; border:1px solid var(--border);
    padding:16px;
  }
  .card h3{
    margin:0 0 12px 0; font-size:12.5px; font-weight:800; color:var(--navy);
    text-transform:uppercase; letter-spacing:.5px;
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  input[type=text], input[type=number], input[type=tel], input[type=date], select, textarea{
    width:100%; padding:12px 12px; border:1.5px solid var(--border); border-radius:9px;
    font-size:16px; font-family:var(--font); color:var(--text); background:#fff;
  }
  textarea{resize:vertical; min-height:64px;}
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--navy-2); }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  details.more{margin-top:2px;}
  details.more summary{
    font-size:12.5px; color:var(--navy-2); font-weight:700; cursor:pointer; padding:6px 0;
    list-style:none;
  }
  details.more summary::-webkit-details-marker{display:none;}
  details.more summary::before{content:"+ "; }
  details.more[open] summary::before{content:"– "; }
  details.more .field{margin-top:10px;}

  .item-card{
    border:1.5px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; background:#FAFBFC;
  }
  .item-card .field{margin-bottom:10px;}
  .item-foot{display:flex; align-items:center; justify-content:space-between;}
  .item-total{font-size:13px; color:var(--navy); font-weight:700;}
  .remove-btn{
    background:none; border:none; color:var(--red); font-size:12.5px; font-weight:700; padding:4px;
  }
  .add-item{
    width:100%; padding:12px; border:1.5px dashed var(--navy-2); border-radius:10px; background:none;
    color:var(--navy-2); font-weight:700; font-size:14px;
  }

  .nao-row{display:flex; gap:8px; margin-bottom:8px;}
  .nao-row input{flex:1;}

  footer.bar{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)) 16px; z-index:30;
  }
  .bar-inner{max-width:520px; margin:0 auto; display:flex; align-items:center; gap:12px;}
  .bar-total{flex:1;}
  .bar-total .lbl{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
  .bar-total .val{font-size:19px; font-weight:800; color:var(--navy);}
  .download-btn{
    background:var(--red); color:#fff; border:none; border-radius:10px; padding:14px 20px;
    font-size:14.5px; font-weight:800; font-family:var(--font);
  }
  .download-btn:disabled{opacity:.6;}

  .hint{font-size:11.5px; color:var(--muted); margin-top:6px;}
</style>
</head>
<body>

<header>
  <img id="logoImg" src="" alt="Engetmix">
  <div class="htxt">Orçamentos<small>Engetmix Concretos Usinados</small></div>
  <button id="resetBtn">Novo</button>
</header>

<div class="wrap">
  <div class="segmented" id="tabs">
    <button data-type="perfuracao">Perfuração</button>
    <button data-type="concreto">Concreto</button>
    <button data-type="piso">Piso Polido</button>
  </div>

  <div id="formArea"></div>
</div>

<footer class="bar">
  <div class="bar-inner">
    <div class="bar-total">
      <div class="lbl">Total</div>
      <div class="val" id="totalDisplay">R$ 0,00</div>
    </div>
    <button class="download-btn" id="downloadBtn">Baixar PDF</button>
  </div>
</footer>

/* ============ UTIL ============ */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function formatDateBR(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return d+'/'+m+'/'+y;
}
function formatBRL(v){
  const n = isNaN(v) ? 0 : v;
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  let cur = obj;
  for(let i=0;i<parts.length-1;i++) cur = cur[parts[i]];
  cur[parts[parts.length-1]] = value;
}
function itemTotal(item){
  const q = parseFloat(item.quantidade), v = parseFloat(item.valorUnitario);
  if(isNaN(q) || isNaN(v)) return 0;
  return q*v;
}
function itemsTotal(items){ return items.reduce((s,it)=>s+itemTotal(it),0); }

/* ============ FORM RENDER ============ */
function renderItemCards(items){
  return items.map((it, idx) => `
    <div class="item-card">
      <div class="field">
        <label>Descrição</label>
        <input type="text" data-field="items.${idx}.descricao" value="${escapeHtml(it.descricao)}" placeholder="Ex: Concreto usinado FCK 25">
      </div>
      <div class="row2">
        <div class="field">
          <label>Qtd.</label>
          <input type="number" inputmode="decimal" step="0.01" data-field="items.${idx}.quantidade" value="${it.quantidade}">
        </div>
        <div class="field">
          <label>Valor unit. (R$)</label>
          <input type="number" inputmode="decimal" step="0.01" data-field="items.${idx}.valorUnitario" value="${it.valorUnitario}">
        </div>
      </div>
      <div class="field">
        <label>Unidade</label>
        <select data-field="items.${idx}.unidade">
          ${UNIDADES.map(u => `<option value="${u}" ${u===it.unidade?'selected':''}>${u}</option>`).join('')}
        </select>
      </div>
      <div class="item-foot">
        <span class="item-total">Total: ${formatBRL(itemTotal(it))}</span>
        <button class="remove-btn" data-action="remove-item" data-index="${idx}">Remover item</button>
      </div>
    </div>
  `).join('');
}

function renderForm(){
  const s = state[activeType];
  const area = document.getElementById('formArea');

  let extra = '';
  if(activeType === 'perfuracao'){
    extra = `
      <div class="card">
        <h3>Itens</h3>
        ${renderItemCards(s.items)}
        <button class="add-item" data-action="add-item">+ Adicionar item</button>
      </div>
      <div class="card">
        <h3>Detalhamento das estacas</h3>
        <div class="field">
          <label>Observação (ex: 49 estacas de 8 metros)</label>
          <textarea data-field="detalhamento" placeholder="Detalhe as estacas, profundidades, etc.">${escapeHtml(s.detalhamento)}</textarea>
        </div>
      </div>
    `;
  } else if(activeType === 'concreto'){
    extra = `
      <div class="card">
        <h3>Itens</h3>
        ${renderItemCards(s.items)}
        <button class="add-item" data-action="add-item">+ Adicionar item</button>
      </div>
      <div class="card">
        <h3>Observações finais</h3>
        <div class="field">
          <textarea data-field="observacoes" placeholder="Observações sobre o fornecimento...">${escapeHtml(s.observacoes)}</textarea>
        </div>
      </div>
    `;
  } else if(activeType === 'piso'){
    extra = `
      <div class="card">
        <h3>Área do piso</h3>
        <div class="field">
          <label>Área total (m²)</label>
          <input type="number" inputmode="decimal" step="0.01" data-field="areaM2" value="${s.areaM2}" placeholder="Ex: 648">
        </div>
      </div>
      <div class="card">
        <h3>Itens inclusos</h3>
        ${renderItemCards(s.items)}
        <button class="add-item" data-action="add-item">+ Adicionar item</button>
      </div>
      <div class="card">
        <h3>Desconto</h3>
        <div class="field">
          <label>Valor de desconto (R$)</label>
          <input type="number" inputmode="decimal" step="0.01" data-field="desconto" value="${s.desconto}">
        </div>
      </div>
      <div class="card">
        <h3>Itens não inclusos</h3>
        <div id="naoInclusosWrap">
          ${s.itensNaoInclusos.map((txt,idx)=>`
            <div class="nao-row">
              <input type="text" data-field="itensNaoInclusos.${idx}" value="${escapeHtml(txt)}">
              <button class="remove-btn" data-action="remove-nao-incluso" data-index="${idx}">Remover</button>
            </div>
          `).join('')}
        </div>
        <button class="add-item" data-action="add-nao-incluso">+ Adicionar item não incluso</button>
      </div>
      <div class="card">
        <h3>Descrição dos serviços</h3>
        <div class="field">
          <textarea data-field="descricaoServicos" placeholder="Detalhes adicionais sobre a execução...">${escapeHtml(s.descricaoServicos)}</textarea>
        </div>
      </div>
    `;
  }

  area.innerHTML = `
    <div class="card">
      <h3>Cliente</h3>
      <div class="field">
        <label>Nome do cliente / construtora</label>
        <input type="text" data-field="client.cliente" value="${escapeHtml(s.client.cliente)}">
      </div>
      <div class="row2">
        <div class="field">
          <label>Data</label>
          <input type="date" data-field="client.data" value="${escapeHtml(s.client.data)}">
        </div>
        <div class="field">
          <label>Cidade</label>
          <input type="text" data-field="client.cidade" value="${escapeHtml(s.client.cidade)}">
        </div>
      </div>
      <div class="field">
        <label>Endereço da obra</label>
        <input type="text" data-field="client.endereco" value="${escapeHtml(s.client.endereco)}">
      </div>
      <div class="field">
        <label>Telefone do cliente</label>
        <input type="tel" data-field="client.fone" value="${escapeHtml(s.client.fone)}">
      </div>
      <details class="more">
        <summary>Mais dados do cliente</summary>
        <div class="field">
          <label>CNPJ / CPF</label>
          <input type="text" data-field="client.cnpj" value="${escapeHtml(s.client.cnpj)}">
        </div>
        <div class="field">
          <label>Inscrição Estadual / RG</label>
          <input type="text" data-field="client.inscEstadual" value="${escapeHtml(s.client.inscEstadual)}">
        </div>
      </details>
    </div>

    <div class="card">
      <h3>Vendedor</h3>
      <div class="row2">
        <div class="field">
          <label>Nome</label>
          <input type="text" data-field="client.vendedor" value="${escapeHtml(s.client.vendedor)}">
        </div>
        <div class="field">
          <label>Telefone</label>
          <input type="tel" data-field="client.telVendedor" value="${escapeHtml(s.client.telVendedor)}">
        </div>
      </div>
    </div>

    ${extra}

    <div class="card">
      <h3>Condições</h3>
      <div class="field">
        <label>Prazo de execução</label>
        <input type="text" data-field="prazoExecucao" value="${escapeHtml(s.prazoExecucao)}" placeholder="Ex: 5 dias úteis">
      </div>
      <div class="field">
        <label>Validade da proposta</label>
        <input type="text" data-field="validadeProposta" value="${escapeHtml(s.validadeProposta)}">
      </div>
      <div class="field">
        <label>Forma de pagamento</label>
        <input type="text" data-field="formaPagamento" value="${escapeHtml(s.formaPagamento)}">
      </div>
      <div class="field">
        <label>Responsável pela assinatura (Engetmix)</label>
        <input type="text" data-field="responsavel" value="${escapeHtml(s.responsavel)}" placeholder="Nome de quem assina">
      </div>
    </div>
  `;

  updateTotal();
}

function updateTotal(){
  const s = state[activeType];
  document.getElementById('totalDisplay').textContent = formatBRL(itemsTotal(s.items));
}

/* ============ EVENTS ============ */
document.getElementById('formArea').addEventListener('input', (e) => {
  const field = e.target.getAttribute('data-field');
  if(!field) return;
  const s = state[activeType];
  let value = e.target.value;
  if(e.target.type === 'number') value = value === '' ? '' : parseFloat(value);
  setByPath(s, field, value);
  const itemMatch = field.match(/^items\.(\d+)\./);
  if(itemMatch){
    const idx = parseInt(itemMatch[1]);
    const card = document.querySelectorAll('.item-card')[idx];
    if(card){
      const totalSpan = card.querySelector('.item-total');
      if(totalSpan) totalSpan.textContent = 'Total: ' + formatBRL(itemTotal(s.items[idx]));
    }
  }
  updateTotal();
});

document.getElementById('formArea').addEventListener('click', (e) => {
  const action = e.target.getAttribute('data-action');
  if(!action) return;
  const s = state[activeType];
  if(action === 'add-item'){ s.items.push(newItem('',1,'m',0)); renderForm(); }
  else if(action === 'remove-item'){ s.items.splice(parseInt(e.target.getAttribute('data-index')),1); renderForm(); }
  else if(action === 'add-nao-incluso'){ s.itensNaoInclusos.push(''); renderForm(); }
  else if(action === 'remove-nao-incluso'){ s.itensNaoInclusos.splice(parseInt(e.target.getAttribute('data-index')),1); renderForm(); }
});

document.getElementById('tabs').addEventListener('click', (e) => {
  const type = e.target.getAttribute('data-type');
  if(!type) return;
  activeType = type;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.getAttribute('data-type')===type));
  renderForm();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if(!confirm('Limpar os dados de "' + TYPE_LABELS[activeType] + '"?')) return;
  state[activeType] = defaultState(activeType);
  renderForm();
});

/* ============ PDF EXPORT (drawn with jsPDF, sem screenshot) ============ */
function wrapText(pdf, text, maxWidth){
  return pdf.splitTextToSize(text || '', maxWidth);
}

function gerarPDF(){
  const s = state[activeType];
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const pageW = 210, pageH = 297, margin = 15;
  const contentW = pageW - margin*2;
  let y = margin;

  const NAVY = [15,37,64];
  const RED = [200,32,47];
  const MUTED = [105,115,125];
  const LIGHT = [245,246,248];
  const BORDER = [220,225,230];

  function ensureSpace(h){
    if(y + h > pageH - margin){ pdf.addPage(); y = margin; }
  }

  // Header: logo + title
  try{ pdf.addImage(LOGO_BASE64, 'PNG', margin, y, 38, 13.1); }catch(e){}
  pdf.setFont('helvetica','bold'); pdf.setFontSize(14); pdf.setTextColor(...NAVY);
  pdf.text(s.titulo || 'Orçamento', pageW - margin, y + 6, {align:'right'});
  if(s.subtitulo){
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5); pdf.setTextColor(...MUTED);
    pdf.text(s.subtitulo, pageW - margin, y + 11.5, {align:'right'});
  }
  y += 20;
  pdf.setDrawColor(...NAVY); pdf.setLineWidth(0.8);
  pdf.line(margin, y, pageW - margin, y);
  y += 8;

  // Client grid (2 columns)
  const rows = [
    ['Cliente', s.client.cliente || '—'],
    ['Data', formatDateBR(s.client.data)],
    ['Endereço', s.client.endereco || '—'],
    ['Cidade', s.client.cidade || '—'],
    ['Telefone', s.client.fone || '—'],
    ['CNPJ / CPF', s.client.cnpj || '—'],
    ['Insc. Estadual', s.client.inscEstadual || '—'],
    ['Contato Engetmix', [s.client.vendedor, s.client.telVendedor].filter(Boolean).join(' — ') || '—']
  ];
  pdf.setFontSize(9.5);
  const colW = contentW/2;
  for(let i=0;i<rows.length;i+=2){
    ensureSpace(7);
    for(let c=0;c<2;c++){
      const r = rows[i+c];
      if(!r) continue;
      const x = margin + c*colW;
      pdf.setFont('helvetica','normal'); pdf.setTextColor(...MUTED);
      pdf.text(r[0], x, y);
      pdf.setFont('helvetica','bold'); pdf.setTextColor(30,36,44);
      pdf.text(String(r[1]), x, y + 4.3);
    }
    y += 11;
  }
  y += 3;

  // Items table
  ensureSpace(14);
  pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5); pdf.setTextColor(...NAVY);
  pdf.text('Itens do orçamento', margin, y);
  y += 5;

  const cols = [
    {key:'descricao', label:'Descrição', width: contentW*0.42, align:'left'},
    {key:'quantidade', label:'Qtd.', width: contentW*0.13, align:'right'},
    {key:'unidade', label:'Un.', width: contentW*0.10, align:'right'},
    {key:'valorUnitario', label:'Valor unit.', width: contentW*0.17, align:'right'},
    {key:'total', label:'Total', width: contentW*0.18, align:'right'}
  ];

  function drawTableHeader(){
    ensureSpace(9);
    pdf.setFillColor(...NAVY);
    pdf.rect(margin, y, contentW, 8, 'F');
    pdf.setFont('helvetica','bold'); pdf.setFontSize(8.5); pdf.setTextColor(255,255,255);
    let cx = margin;
    cols.forEach(col => {
      const tx = col.align === 'right' ? cx + col.width - 2 : cx + 2;
      pdf.text(col.label, tx, y + 5.4, {align: col.align});
      cx += col.width;
    });
    y += 8;
  }

  drawTableHeader();
  let rowIndex = 0;
  s.items.forEach(it => {
    const descLines = wrapText(pdf, it.descricao || 'Item sem descrição', cols[0].width - 4);
    const rowH = Math.max(descLines.length * 4.2 + 3, 8);
    if(y + rowH > pageH - margin){ pdf.addPage(); y = margin; drawTableHeader(); }
    if(rowIndex % 2 === 1){ pdf.setFillColor(...LIGHT); pdf.rect(margin, y, contentW, rowH, 'F'); }
    pdf.setDrawColor(...BORDER); pdf.setLineWidth(0.2);
    pdf.line(margin, y+rowH, margin+contentW, y+rowH);

    let cx = margin;
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(30,36,44);
    pdf.text(descLines, cx + 2, y + 5);
    cx += cols[0].width;

    const qtd = isNaN(parseFloat(it.quantidade)) ? '—' : parseFloat(it.quantidade).toLocaleString('pt-BR');
    pdf.text(qtd, cx + cols[1].width - 2, y + 5, {align:'right'});
    cx += cols[1].width;

    pdf.text(String(it.unidade || ''), cx + cols[2].width - 2, y + 5, {align:'right'});
    cx += cols[2].width;

    pdf.text(formatBRL(parseFloat(it.valorUnitario)||0), cx + cols[3].width - 2, y + 5, {align:'right'});
    cx += cols[3].width;

    pdf.setFont('helvetica','bold');
    pdf.text(formatBRL(itemTotal(it)), cx + cols[4].width - 2, y + 5, {align:'right'});

    y += rowH;
    rowIndex++;
  });

  y += 3;
  ensureSpace(14);
  const total = itemsTotal(s.items);
  pdf.setDrawColor(...NAVY); pdf.setLineWidth(0.6);
  pdf.line(margin, y, pageW - margin, y);
  y += 7;
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10); pdf.setTextColor(...MUTED);
  pdf.text('Valor total', pageW - margin - 40, y, {align:'right'});
  pdf.setFont('helvetica','bold'); pdf.setFontSize(14); pdf.setTextColor(...NAVY);
  pdf.text(formatBRL(total), pageW - margin, y, {align:'right'});
  y += 10;

  if(activeType === 'piso' && parseFloat(s.desconto) > 0){
    const desc = parseFloat(s.desconto);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(10); pdf.setTextColor(...MUTED);
    pdf.text('Valor com desconto', pageW - margin - 40, y, {align:'right'});
    pdf.setFont('helvetica','bold'); pdf.setFontSize(14); pdf.setTextColor(...RED);
    pdf.text(formatBRL(total - desc), pageW - margin, y, {align:'right'});
    y += 10;
  }

  function drawNoteSection(title, text){
    ensureSpace(14);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5); pdf.setTextColor(...NAVY);
    pdf.text(title, margin, y);
    y += 5;
    const lines = wrapText(pdf, text && text.trim() ? text : 'Sem observações adicionais.', contentW - 8);
    const boxH = lines.length * 4.6 + 6;
    ensureSpace(boxH);
    pdf.setFillColor(...LIGHT);
    pdf.rect(margin, y, contentW, boxH, 'F');
    pdf.setDrawColor(...NAVY); pdf.setLineWidth(1.2);
    pdf.line(margin, y, margin, y + boxH);
    pdf.setFont('helvetica', text && text.trim() ? 'normal' : 'italic');
    pdf.setFontSize(9); pdf.setTextColor(text && text.trim() ? 30 : 105, text && text.trim() ? 36 : 115, text && text.trim() ? 44 : 125);
    pdf.text(lines, margin + 5, y + 5.5);
    y += boxH + 8;
  }

  function drawListSection(title, items){
    ensureSpace(14);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5); pdf.setTextColor(...NAVY);
    pdf.text(title, margin, y);
    y += 6;
    const clean = items.filter(x => x && x.trim());
    if(clean.length === 0){
      pdf.setFont('helvetica','italic'); pdf.setFontSize(9); pdf.setTextColor(...MUTED);
      pdf.text('Nenhum item listado.', margin, y);
      y += 7;
      return;
    }
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5); pdf.setTextColor(30,36,44);
    clean.forEach(txt => {
      ensureSpace(6);
      pdf.text('•', margin, y);
      pdf.text(txt, margin + 4, y);
      y += 5.5;
    });
    y += 3;
  }

  if(activeType === 'perfuracao'){
    drawNoteSection('Detalhamento das estacas', s.detalhamento);
  } else if(activeType === 'concreto'){
    drawNoteSection('Observações finais', s.observacoes);
  } else if(activeType === 'piso'){
    drawListSection('Itens não inclusos', s.itensNaoInclusos);
    drawNoteSection('Descrição dos serviços', s.descricaoServicos);
  }

  // Conditions
  ensureSpace(20);
  pdf.setDrawColor(...BORDER); pdf.setLineWidth(0.3);
  pdf.line(margin, y, pageW - margin, y);
  y += 7;
  const condW = contentW/3;
  const conds = [
    ['Prazo de execução', s.prazoExecucao || '—'],
    ['Validade da proposta', s.validadeProposta || '—'],
    ['Forma de pagamento', s.formaPagamento || '—']
  ];
  conds.forEach((c, i) => {
    const x = margin + i*condW;
    pdf.setFont('helvetica','bold'); pdf.setFontSize(8); pdf.setTextColor(...NAVY);
    pdf.text(c[0].toUpperCase(), x, y);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(30,36,44);
    pdf.text(wrapText(pdf, c[1], condW - 5), x, y + 5);
  });
  y += 26;

  // Signatures
  ensureSpace(20);
  const sigW = contentW/2 - 8;
  pdf.setDrawColor(30,36,44); pdf.setLineWidth(0.3);
  pdf.line(margin, y, margin + sigW, y);
  pdf.line(margin + contentW - sigW, y, pageW - margin, y);
  y += 5;
  pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(30,36,44);
  pdf.text(s.responsavel || 'Responsável', margin + sigW/2, y, {align:'center'});
  pdf.text('ENGETMIX CONCRETOS USINADOS', margin + contentW - sigW/2, y, {align:'center'});

  const clienteSlug = (s.client.cliente || 'cliente').trim().replace(/[^a-zA-Z0-9]+/g,'_');
  const dataSlug = (s.client.data || todayISO()).replace(/-/g,'');
  const filename = `Orcamento_${TYPE_LABELS[activeType].replace(/\s+/g,'_')}_${clienteSlug}_${dataSlug}.pdf`;
  pdf.save(filename);
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const btn = document.getElementById('downloadBtn');
  const original = btn.textContent;
  btn.textContent = 'Gerando...';
  btn.disabled = true;
  setTimeout(() => {
    try{ gerarPDF(); }
    catch(err){ alert('Não foi possível gerar o PDF. Detalhe: ' + err.message); }
    finally{ btn.textContent = original; btn.disabled = false; }
  }, 30);
});

/* ============ INIT ============ */
document.querySelector('#tabs button[data-type="perfuracao"]').classList.add('active');
renderForm();
</script>
